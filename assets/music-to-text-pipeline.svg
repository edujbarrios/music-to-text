<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="430" viewBox="0 0 1280 430" role="img" aria-labelledby="title desc">
  <title id="title">Music-to-text framework pipeline</title>
  <desc id="desc">A scientific paper style diagram showing audio input flowing through musical analysis and structured metadata into LLM-generated descriptions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#1f2937"/>
    </marker>
    <filter id="shadow" x="-10%" y="-10%" width="120%" height="130%">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#111827" flood-opacity="0.12"/>
    </filter>
    <style>
      .paper { fill: #fbfbf8; }
      .grid { stroke: #e5e7eb; stroke-width: 1; opacity: 0.75; }
      .panel { fill: #ffffff; stroke: #1f2937; stroke-width: 1.7; rx: 8; filter: url(#shadow); }
      .panel-accent { fill: #eef6ff; stroke: #1d4ed8; stroke-width: 1.5; rx: 8; }
      .title { font: 700 26px Georgia, "Times New Roman", serif; fill: #111827; }
      .subtitle { font: 400 15px Georgia, "Times New Roman", serif; fill: #4b5563; }
      .label { font: 700 19px Arial, Helvetica, sans-serif; fill: #111827; }
      .mono { font: 500 14px "Courier New", monospace; fill: #374151; }
      .small { font: 400 13px Arial, Helvetica, sans-serif; fill: #4b5563; }
      .caption { font: 400 13px Georgia, "Times New Roman", serif; fill: #374151; }
      .arrow { stroke: #1f2937; stroke-width: 2.2; marker-end: url(#arrow); fill: none; }
      .wave { stroke: #2563eb; stroke-width: 2.4; fill: none; }
      .bar { fill: #2563eb; opacity: 0.75; }
      .tag { fill: #f3f4f6; stroke: #9ca3af; stroke-width: 1; rx: 12; }
    </style>
  </defs>

  <rect class="paper" x="0" y="0" width="1280" height="430"/>
  <g>
    <path class="grid" d="M80 350 H1200"/>
    <path class="grid" d="M80 290 H1200"/>
    <path class="grid" d="M80 230 H1200"/>
    <path class="grid" d="M80 170 H1200"/>
    <path class="grid" d="M80 110 H1200"/>
  </g>

  <text class="title" x="640" y="46" text-anchor="middle">Music-to-Text Framework</text>
  <text class="subtitle" x="640" y="72" text-anchor="middle">Audio in -> musical analysis -> structured metadata -> LLM-generated descriptions</text>

  <g transform="translate(70 120)">
    <rect class="panel" x="0" y="0" width="230" height="190"/>
    <text class="label" x="115" y="34" text-anchor="middle">Audio Input</text>
    <path class="wave" d="M34 98 C48 60, 62 136, 76 98 S104 60, 118 98 S146 136, 160 98 S188 60, 202 98"/>
    <text class="mono" x="115" y="139" text-anchor="middle">mp3 / wav / flac / m4a</text>
    <text class="small" x="115" y="163" text-anchor="middle">local files, YouTube, SoundCloud</text>
  </g>

  <path class="arrow" d="M320 215 H405"/>

  <g transform="translate(425 120)">
    <rect class="panel" x="0" y="0" width="230" height="190"/>
    <text class="label" x="115" y="34" text-anchor="middle">Musical Analysis</text>
    <g transform="translate(44 64)">
      <rect class="bar" x="0" y="66" width="18" height="28"/>
      <rect class="bar" x="31" y="44" width="18" height="50"/>
      <rect class="bar" x="62" y="18" width="18" height="76"/>
      <rect class="bar" x="93" y="34" width="18" height="60"/>
      <rect class="bar" x="124" y="8" width="18" height="86"/>
      <line x1="0" y1="96" x2="150" y2="96" stroke="#4b5563" stroke-width="1.5"/>
    </g>
    <text class="small" x="115" y="151" text-anchor="middle">tempo, key, loudness, chroma</text>
    <text class="small" x="115" y="172" text-anchor="middle">sections, energy, onset strength</text>
  </g>

  <path class="arrow" d="M675 215 H760"/>

  <g transform="translate(780 120)">
    <rect class="panel" x="0" y="0" width="230" height="190"/>
    <text class="label" x="115" y="34" text-anchor="middle">Structured Metadata</text>
    <rect class="tag" x="34" y="60" width="74" height="27"/>
    <text class="small" x="71" y="78" text-anchor="middle">genre</text>
    <rect class="tag" x="122" y="60" width="74" height="27"/>
    <text class="small" x="159" y="78" text-anchor="middle">mood</text>
    <rect class="tag" x="30" y="103" width="86" height="27"/>
    <text class="small" x="73" y="121" text-anchor="middle">energy</text>
    <rect class="tag" x="128" y="103" width="72" height="27"/>
    <text class="small" x="164" y="121" text-anchor="middle">key</text>
    <text class="mono" x="115" y="160" text-anchor="middle">{ deterministic JSON }</text>
  </g>

  <path class="arrow" d="M1030 215 H1115"/>

  <g transform="translate(1135 120)">
    <rect class="panel-accent" x="0" y="0" width="110" height="190"/>
    <text class="label" x="55" y="34" text-anchor="middle">LLM</text>
    <text class="small" x="55" y="67" text-anchor="middle">summary</text>
    <text class="small" x="55" y="91" text-anchor="middle">A&amp;R</text>
    <text class="small" x="55" y="115" text-anchor="middle">PR</text>
    <text class="small" x="55" y="139" text-anchor="middle">playlist</text>
    <text class="small" x="55" y="163" text-anchor="middle">sync</text>
  </g>

  <text class="caption" x="80" y="370">Figure 1. The music-to-text pipeline converts audio into measurable features, normalizes them as metadata, and uses an optional OpenAI-compatible LLM layer to produce human-readable descriptions.</text>
</svg>
