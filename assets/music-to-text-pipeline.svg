<svg xmlns="http://www.w3.org/2000/svg" width="1180" height="250" viewBox="0 0 1180 250" preserveAspectRatio="xMidYMid meet" role="img" aria-labelledby="title desc">
  <title id="title">Music-to-text framework pipeline</title>
  <desc id="desc">Pipeline diagram: audio input flows into musical analysis, then structured metadata, then LLM-generated descriptions.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#111827"/>
    </marker>
    <style>
      .bg { fill: #fdfdfb; }
      .grid { stroke: #e7e9ee; stroke-width: 1; opacity: 0.85; }
      .card { fill: #ffffff; stroke: #111827; stroke-width: 1.6; }
      .llm-card { fill: #f7fbff; stroke: #2563eb; stroke-width: 1.6; }
      .title { font: 700 17px Arial, Helvetica, sans-serif; fill: #0f172a; }
      .small { font: 400 12px Arial, Helvetica, sans-serif; fill: #334155; }
      .tiny { font: 500 11px "Courier New", monospace; fill: #334155; }
      .arrow { stroke: #111827; stroke-width: 2.2; stroke-linecap: round; marker-end: url(#arrow); }
      .wave { fill: none; stroke: #2563eb; stroke-width: 3; stroke-linecap: round; }
      .bar { fill: #5b7fe3; }
      .tag { fill: #f8fafc; stroke: #aeb7c5; stroke-width: 1; }
    </style>
  </defs>

  <rect class="bg" x="0" y="0" width="1180" height="250"/>
  <path class="grid" d="M30 40 H1150"/>
  <path class="grid" d="M30 100 H1150"/>
  <path class="grid" d="M30 160 H1150"/>
  <path class="grid" d="M30 220 H1150"/>

  <g transform="translate(34 32)">
    <rect class="card" x="0" y="0" width="220" height="176" rx="8"/>
    <text class="title" x="110" y="32" text-anchor="middle">Audio Input</text>
    <path class="wave" d="M40 92 C54 68, 68 122, 82 92 S110 60, 124 92 S152 126, 166 92 S194 62, 208 92"/>
    <text class="tiny" x="110" y="130" text-anchor="middle">mp3 / wav / flac / m4a</text>
    <text class="small" x="110" y="151" text-anchor="middle">local files, YouTube, SoundCloud</text>
  </g>

  <line class="arrow" x1="280" y1="120" x2="360" y2="120"/>

  <g transform="translate(388 32)">
    <rect class="card" x="0" y="0" width="220" height="176" rx="8"/>
    <text class="title" x="110" y="32" text-anchor="middle">Musical Analysis</text>
    <g transform="translate(56 54)">
      <rect class="bar" x="0" y="44" width="18" height="26"/>
      <rect class="bar" x="30" y="30" width="18" height="40"/>
      <rect class="bar" x="60" y="12" width="18" height="58"/>
      <rect class="bar" x="90" y="24" width="18" height="46"/>
      <rect class="bar" x="120" y="6" width="18" height="64"/>
      <line x1="-8" y1="72" x2="146" y2="72" stroke="#475569" stroke-width="1.4"/>
    </g>
    <text class="small" x="110" y="148" text-anchor="middle">tempo, key, loudness, chroma</text>
    <text class="small" x="110" y="166" text-anchor="middle">sections, energy, onset strength</text>
  </g>

  <line class="arrow" x1="634" y1="120" x2="714" y2="120"/>

  <g transform="translate(742 32)">
    <rect class="card" x="0" y="0" width="220" height="176" rx="8"/>
    <text class="title" x="110" y="32" text-anchor="middle">Structured Metadata</text>
    <rect class="tag" x="38" y="58" width="68" height="26" rx="13"/>
    <text class="small" x="72" y="76" text-anchor="middle">genre</text>
    <rect class="tag" x="124" y="58" width="58" height="26" rx="13"/>
    <text class="small" x="153" y="76" text-anchor="middle">mood</text>
    <rect class="tag" x="40" y="100" width="68" height="26" rx="13"/>
    <text class="small" x="74" y="118" text-anchor="middle">energy</text>
    <rect class="tag" x="126" y="100" width="52" height="26" rx="13"/>
    <text class="small" x="152" y="118" text-anchor="middle">key</text>
    <text class="tiny" x="110" y="153" text-anchor="middle">{ deterministic JSON }</text>
  </g>

  <line class="arrow" x1="988" y1="120" x2="1038" y2="120"/>

  <g transform="translate(1060 32)">
    <rect class="llm-card" x="0" y="0" width="112" height="176" rx="8"/>
    <text class="title" x="56" y="32" text-anchor="middle">LLM</text>
    <text class="small" x="56" y="62" text-anchor="middle">summary</text>
    <text class="small" x="56" y="86" text-anchor="middle">A&amp;R</text>
    <text class="small" x="56" y="110" text-anchor="middle">PR</text>
    <text class="small" x="56" y="134" text-anchor="middle">playlist</text>
    <text class="small" x="56" y="158" text-anchor="middle">sync</text>
  </g>
</svg>
